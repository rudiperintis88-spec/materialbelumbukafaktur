<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Material Belum Dibuka Faktur BP Flamboyan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" async></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f7f8fb; --bg2:#fdf7f4; --card:#ffffff; --ink:#14161f; --muted:#6a6f80; --line:#e5e7ef; --line2:#cfd3e0;
  --thbg:#f0f1f8; --hover:#f4f2ff; --accent:#5a3fd4; --accent-soft:#ece8ff;
  --ok:#1a9a4a; --amber:#c76a0a; --orange:#d2480f; --red:#d92d20; --redbg:#fdeeee; --redline:#f3c9c6;
  --flag:#fff1dc; --flagink:#7a4300; --mark:#f6dc78; --markink:#3b3000;
  --c1:#b7a8f6; --c2:#8466e6; --c3:#4a2eb5; --c4:#9a9fb2; --c5:#3b9aa8; --c6:#e3a53a; --c7:#d9577a; --c8:#6f8bd6;
  --focus:#0b6fd1; --shadow:0 1px 2px rgba(20,22,31,.04),0 6px 18px rgba(20,22,31,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117; --bg2:#15121a; --card:#171a23; --ink:#eceef6; --muted:#9aa0b4; --line:#262a38; --line2:#363b4d;
    --thbg:#1d2130; --hover:#221f3a; --accent:#a392ff; --accent-soft:#2a2550;
    --ok:#5fd68a; --amber:#f0a24a; --orange:#ff8a5c; --red:#ff7a70; --redbg:#2d1719; --redline:#5a2a2c;
    --flag:#3a2a14; --flagink:#ffd9a8; --mark:#8a7414; --markink:#fff6cf;
    --c1:#6c5fb0; --c2:#8f78f0; --c3:#c3b6ff; --c4:#6a7088; --c5:#58b9c7; --c6:#f0bd5a; --c7:#ee7a98; --c8:#8fa8ee; --focus:#6fb4ff; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117; --bg2:#15121a; --card:#171a23; --ink:#eceef6; --muted:#9aa0b4; --line:#262a38; --line2:#363b4d;
  --thbg:#1d2130; --hover:#221f3a; --accent:#a392ff; --accent-soft:#2a2550;
  --ok:#5fd68a; --amber:#f0a24a; --orange:#ff8a5c; --red:#ff7a70; --redbg:#2d1719; --redline:#5a2a2c;
  --flag:#3a2a14; --flagink:#ffd9a8; --mark:#8a7414; --markink:#fff6cf;
  --c1:#6c5fb0; --c2:#8f78f0; --c3:#c3b6ff; --c4:#6a7088; --c5:#58b9c7; --c6:#f0bd5a; --c7:#ee7a98; --c8:#8fa8ee; --focus:#6fb4ff; --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:13.5px;line-height:1.45;font-variant-numeric:tabular-nums;
  background:var(--bg);background-image:linear-gradient(115deg,var(--bg) 40%,var(--bg2) 100%);background-attachment:fixed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
button,select,input{font:inherit;color:var(--ink)}
.page{max-width:1500px;margin:0 auto;padding:28px 44px 36px}
.serif{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.015em}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* kepala halaman */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"co co" "title live" "per source" ". detail";column-gap:36px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}
.top .co{grid-area:co;color:var(--muted);font-size:14.5px}
.top h1{grid-area:title;margin:2px 0 4px;font-size:clamp(26px,2.7vw,36px);line-height:1.12}
.per{grid-area:per;color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.stale{background:#fdecc8;color:#7a4300;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stale{background:#42300f;color:#ffd48a}}
:root[data-theme="dark"] .stale{background:#42300f;color:#ffd48a}
.liverow{grid-area:live;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:flex-end}
.live{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:14.5px}
.live b{color:var(--ink);font-weight:600}
.sync{width:20px;height:20px;flex:none;display:block}
.sync rect{fill:var(--sync,#3b82f6)}
.sync .arr{transform-origin:11px 11px}
.live.warn{--sync:var(--amber)}
.live.bad{--sync:var(--red)}
.live.off{--sync:#8a90a3}
.live.busy .arr{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.live.busy .arr{animation:none}}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--thbg);border:1px solid var(--line);border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500;font-size:14.5px;color:var(--ink)}
.btn .sync{width:19px;height:19px}
.btn:hover:not(:disabled){border-color:var(--line2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.flat{background:var(--card);padding:6px 12px;font-size:13.5px;gap:0}
.source{grid-area:source;justify-self:end;color:var(--muted);font-size:14.5px;text-align:right}
.detail{grid-area:detail;justify-self:end;color:var(--muted);font-size:12.5px;text-align:right;max-width:560px;margin-top:6px}
.detail:empty{display:none}
.divtabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-top:6px}
.divtabs::-webkit-scrollbar{display:none}
.divtabs button{all:unset;box-sizing:border-box;flex:1 0 auto;min-width:150px;text-align:center;padding:18px 18px 15px;cursor:pointer;font-weight:600;font-size:17px;line-height:1.25;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.divtabs button:hover{color:var(--ink)}
.divtabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.divtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.divtabs button small{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:var(--muted);background:var(--thbg);border-radius:999px;padding:1px 8px}
.divtabs button[aria-selected="true"] small{background:var(--accent-soft);color:var(--accent)}
.detail{color:var(--muted);font-size:12.5px;text-align:right;max-width:560px}
.detail:empty{display:none}

/* ringkasan */
.summary{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;margin-top:28px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 44px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;min-height:300px}
.hero .lab{color:var(--muted);font-size:16px}
.hero .big{font-size:clamp(34px,5.2vw,62px);line-height:1.05;margin:18px 0 14px;letter-spacing:-.01em;word-break:break-word}
.hero .sub{color:var(--muted);font-size:15px}
.hero .sub b{color:var(--ink);font-weight:600}
.hero .sub .mono{color:var(--ink);font-size:14px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:26px 0 12px;background:var(--line)}
.stack span{display:block;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}
.legend b{color:var(--ink);font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:140px}
.kpi:hover{border-color:var(--line2)}
.kpi:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kpi .k{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:15px}
.kpi .k i{width:10px;height:10px;border-radius:50%;display:block}
.kpi .v{font-size:clamp(20px,2.2vw,27px);font-weight:700;letter-spacing:-.01em}
.kpi .s{color:var(--muted);font-size:14px}
.kpi.late{background:var(--redbg);border-color:var(--redline)}
.kpi.late .v{color:var(--red)}

/* bagian + tab */
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 20px;margin-top:54px}
.sechead h2{margin:0;font-size:32px}
.sechead .cap{color:var(--muted);font-size:14.5px}
nav.subtabs{display:inline-flex;gap:4px;margin-top:0;background:var(--thbg);border-radius:12px;padding:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
nav.subtabs::-webkit-scrollbar{display:none}
nav.subtabs button{all:unset;box-sizing:border-box;flex:none;padding:9px 18px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);white-space:nowrap}
nav.subtabs button:hover{color:var(--ink)}
nav.subtabs button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
nav.subtabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,22,31,.18)}
nav.subtabs button small{display:inline-block;margin-left:7px;font-size:12px;font-weight:600;color:var(--muted)}
nav.subtabs button[aria-selected="true"] small{color:var(--accent)}

/* baris tab + ekspor */
.tabrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:18px}
.export{display:flex;gap:8px;align-items:center}
.xmenu{position:relative}
.xbtn{padding:8px 14px;gap:8px;font-size:14px}
.xbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.xbtn .car{width:14px;height:14px;margin-left:-2px;opacity:.7}
#xlsBtn svg:first-child{color:#1d7a46}
#pdfBtn svg:first-child{color:#c8372d}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px rgba(20,22,31,.18);padding:6px;z-index:40}
.menu button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;width:100%;padding:9px 12px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.menu small{color:var(--muted);font-size:12px}
@media (max-width:1180px){.tabrow{margin-top:16px}.menu{left:0;right:auto}}
/* alat tabel */
.tools{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.facts{display:flex;flex-wrap:wrap;gap:2px 22px;margin:0;padding:0;list-style:none}
.facts li{color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:1px;min-width:112px}
.cat:hover{border-color:var(--line2)}
.cat:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cat b{font-weight:600}
.cat span{color:var(--muted);font-size:12.5px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cat[aria-pressed="true"] b{color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.controls label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.controls select,.controls input[type=search]{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;max-width:100%}
.sbox{flex:1 1 560px;min-width:220px;max-width:820px;display:flex;flex-direction:column}
.sbox input[type=search]{width:100%}
.controls input[type=search]{min-width:0}
.controls select{max-width:230px}
.filters{display:contents}
#ftoggle{display:none}

.gridwrap{position:relative;margin-top:12px}
.xbar{position:sticky;top:0;z-index:26;overflow-x:auto;overflow-y:hidden;height:14px;background:var(--bg);display:none;border-radius:7px}
.xbar div{height:1px}
.fhead{position:fixed;top:0;z-index:25;overflow:hidden;display:none;background:var(--thbg);border-bottom:1px solid var(--line2);box-shadow:0 5px 12px rgba(20,22,31,.10);pointer-events:auto}
.fhead .fin{will-change:transform}
.fhead table{table-layout:fixed;min-width:0}
.grid{overflow-x:auto;overflow-y:hidden;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.jump{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30}
.jump button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(20,22,31,.18)}
.jump button:disabled{opacity:.35;cursor:default}
.jump button:hover:not(:disabled){border-color:var(--accent)}
.jump svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{white-space:pre;padding:9px 14px;border-bottom:1px solid var(--line);text-align:left}
th{position:relative;background:var(--thbg);color:var(--ink);font-weight:600;border-bottom:1px solid var(--line2);user-select:none}
th.sortable{cursor:pointer;padding-right:26px}
th.sortable::after{content:"";position:absolute;right:10px;top:50%;margin-top:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.3}
th[aria-sort="ascending"]::after{border-top:0;border-bottom:5px solid var(--accent);opacity:1}
th[aria-sort="descending"]::after{border-top-color:var(--accent);opacity:1}
th[aria-sort]:not([aria-sort="none"]){color:var(--accent)}
th.num,td.num{text-align:right}
tbody tr:hover td{background:var(--hover)}
tr.flag td{background:var(--flag);color:var(--flagink)}
td.err{color:var(--muted);font-style:italic}
tr.flag td.err{color:var(--flagink)}
td.late{color:var(--red);font-weight:600}
td.long{white-space:normal;min-width:180px;max-width:360px}
tr.total td{background:var(--mark);color:var(--markink);font-weight:700;border-top:1px solid var(--line2);border-bottom:0}
.grid.cardsview{background:transparent;border:0;box-shadow:none;overflow:visible;border-radius:0}
.cardsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;padding-top:4px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.dhead{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.dhead:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.dhead .dn{font-size:19px;display:flex;align-items:center;gap:9px}
.dsecs{display:flex;flex-direction:column;gap:30px}
.dsh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 18px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dsname{all:unset;box-sizing:border-box;cursor:pointer;font-family:Fraunces,Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:-.015em;font-size:22px;line-height:1.2}
.dsname:hover{color:var(--accent)}
.dsname:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
.dsm{color:var(--muted);font-size:13.5px}
.cdot{width:11px;height:11px;border-radius:50%;display:block;flex:none}
.share{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.share span{display:block;height:100%;border-radius:999px}
.shn{color:var(--muted);font-size:12.5px;margin-top:-6px}
.dhead small{color:var(--muted);font-size:12.5px}
.dtot{font-size:clamp(22px,2.1vw,30px);line-height:1.1;word-break:break-word}
.dcard .stack{margin:2px 0 0;height:8px}
.dk{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dk button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"l v" "l w";column-gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.dk button:hover{border-color:var(--line2)}
.dk button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dk i{grid-area:l;width:9px;height:9px;border-radius:50%;display:block}
.dk .kv{grid-area:v;font-weight:700;font-size:15px}
.dk .kw{grid-area:w;color:var(--muted);font-size:12.5px}
.dk .kl{display:none}
.dk .late{background:var(--redbg);border-color:var(--redline)}
.dk .late .kv{color:var(--red)}
.dk em{font-style:normal;color:var(--muted);font-size:12.5px;grid-column:2}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:20;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* layar sempit: di bawah 1180px tampilan disesuaikan untuk tablet dan HP */
@media (max-width:1180px){
  body{font-size:13px}
  .page{padding:18px 16px 30px}
  .top{grid-template-columns:1fr;grid-template-areas:"co" "title" "per" "live" "source" "detail";row-gap:3px;padding-bottom:16px}
  .top .co{font-size:13.5px}
  .top h1{font-size:clamp(22px,5.2vw,30px)}
  .per{font-size:14px}
  .liverow{justify-content:flex-start;margin-top:10px;gap:8px 12px}
  .live{font-size:13.5px}
  .source{justify-self:start;text-align:left;font-size:13.5px;margin-top:8px}
  .detail{justify-self:start;text-align:left}
  .divtabs button{flex:1 0 auto;min-width:0;padding:13px 16px 11px;font-size:14.5px}
  .summary{grid-template-columns:1fr;gap:14px;margin-top:18px}
  .hero{padding:22px 20px;min-height:0;border-radius:16px}
  .hero .lab{font-size:14px}
  .hero .big{font-size:clamp(28px,7.4vw,42px);margin:10px 0 8px}
  .hero .sub{font-size:13.5px}
  .stack{margin:18px 0 10px}
  .legend{font-size:12.5px;gap:4px 16px}
  .kpis{gap:12px}
  .kpi{padding:14px 16px;min-height:104px;gap:6px;border-radius:14px}
  .kpi .k{font-size:13.5px}
  .kpi .v{font-size:clamp(17px,4.4vw,22px)}
  .kpi .s{font-size:12.5px}
  .sechead{margin-top:30px}
  .sechead h2{font-size:22px}
  .sechead .cap{font-size:12.5px}
  nav.subtabs button{padding:8px 13px;font-size:13.5px}
  th,td{padding:8px 10px}
  #ftoggle{display:inline-flex}
  .controls:not(.fopen) .filters{display:none}
  .sbox{flex:1 1 100%;max-width:none}
  .cat{min-width:0;padding:7px 11px}
  .cat span{font-size:12px}
}
@media (max-width:1180px){.cardsgrid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
@media (max-width:640px){
  .cardsgrid{grid-template-columns:1fr}
  .page{padding:14px 10px 26px}
  .kpi .v{font-size:clamp(16px,5vw,20px)}
  .kpi{min-height:96px;padding:12px 13px}
  .hero{padding:18px 16px}
}
@media print{.tabrow .export,nav.subtabs,.divtabs,.controls,.jump,.liverow,.cats,.xbar,.fhead{display:none}.grid{overflow:visible}body{background:#fff}}
</style>
</head>
<body>

var el=function(id){return document.getElementById(id)};
var summaryEl=el('summary'),grid=el('grid'),factsEl=el('facts'),qEl=el('q'),filtersEl=el('filters'),tabsEl=el('tabs'),catsEl=el('cats'),divTabsEl=el('divtabs'),toolsEl=el('tools'),fh=el('fhead'),xbar=el('xbar'),xin=el('xin');
function D(){for(var i=0;i<model.divs.length;i++)if(model.divs[i].name===curDiv)return model.divs[i];return model.divs[0]}
function tstate(name){var k=curDiv+'|'+name;return TS[k]||(TS[k]={q:'',sort:-1,dir:1,filt:{}})}
function sheetByName(n){var sh=D().sheets;for(var i=0;i<sh.length;i++)if(sh[i].name===n)return sh[i];return sh[0]}
function colType(h){return NUMH[h]?'num':(DATEH[h]?'date':'text')}
function sortKey(v,type){
  if(v===''||v==='#N/A')return null;
  if(type==='num'){var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n}
  if(type==='date'){var m=/^(\d\d)\/(\d\d)\/(\d{4})(?: (\d\d):(\d\d):(\d\d))?/.exec(v);return m?+(m[3]+m[2]+m[1])*1000000+(m[4]?+m[4]*10000+ +m[5]*100+ +m[6]:0):null}
  return String(v).toLowerCase();
}
function monthKey(v){var m=/^(\d\d)\/(\d\d)\/(\d{4})/.exec(v||'');return m?m[3]+'-'+m[2]:''}
function monthLabel(k){var p=k.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
var SEARCH=[['No PKB/WO',['No PKB/WO','NoWO']],['Nama SA',['Nama SA','Advisor']],['No. Polisi',['NoPolisi']],['Kode Barang',['KodeBrg']],['Nama Barang',['Nama Barang']],['Nama Customer',['Nama Customer','Nama']]];
function searchCols(s){
  if(s._sc)return s._sc;
  var cols=[],names=[];
  SEARCH.forEach(function(g){for(var i=0;i<g[1].length;i++){var ci=s.heads.indexOf(g[1][i]);if(ci>=0){cols.push({ci:ci,label:g[0]});names.push(g[0]);break}}});
  s._sc={cols:cols,names:names};return s._sc;
}
var FILT=[['Devisi','Divisi'],['Divisi','Divisi'],['Nama SA','Nama SA'],['Charge To','Charge To'],['Charge','Charge To'],[SK,'Kategori'],['Jenis','Jenis'],['Advisor','Advisor'],['Mekanik','Mekanik']];
function filterDefs(s){
  var defs=[],seen={};
  FILT.forEach(function(f){
    var ci=s.heads.indexOf(f[0]);if(ci<0||s.chipCol===ci)return;
    var cnt={};s.rows.forEach(function(r){var v=r[ci];if(v!==''&&v!=='#N/A')cnt[v]=1});
    var keys=Object.keys(cnt);if(keys.length<2||keys.length>80)return;
    var lab=f[1];if(seen[lab])return;seen[lab]=1;
    keys.sort(function(a,b){return a.localeCompare(b,'id',{numeric:true})});
    defs.push({id:'c'+ci,label:lab,col:ci,opts:keys.map(function(k){return {v:k,l:k}})});
  });
  var hc=s.heads.indexOf('Hari');
  if(hc>=0&&s.rows.length)defs.push({id:'age',label:'Umur',bucket:true,col:hc,opts:BUCKETS.map(function(b,i){return {v:String(i),l:b.l}})});
  if(s.dateCol!==undefined){
    var cnt2={};s.rows.forEach(function(r){var k=monthKey(r[s.dateCol]);if(k)cnt2[k]=1});
    var ks=Object.keys(cnt2).sort();
    if(ks.length>1)defs.push({id:'m',label:'Bulan '+(s.heads[s.dateCol]||'tanggal'),month:true,col:s.dateCol,opts:ks.map(function(k){return {v:k,l:monthLabel(k)}})});
  }
  return defs;
}
function setupControls(s){
  var st=tstate(s.name);
  qEl.value=st.q;
  var defs=filterDefs(s);s._defs=defs;
  filtersEl.innerHTML=defs.map(function(d){
    return '<label>'+esc(d.label)+' <select data-f="'+d.id+'" aria-label="Filter '+esc(d.label)+'"><option value="">Semua</option>'+d.opts.map(function(o){return '<option value="'+esc(o.v)+'">'+esc(o.l)+'</option>'}).join('')+'</select></label>';
  }).join('');
  [].forEach.call(filtersEl.querySelectorAll('select'),function(se){
    var k=se.getAttribute('data-f');se.value=st.filt[k]||'';if(se.value!==(st.filt[k]||''))delete st.filt[k];
    se.addEventListener('change',function(){if(se.value)st.filt[k]=se.value;else delete st.filt[k];render()});
  });
  fillSugg(s);renderCats(s);
}
function renderCats(s){
  if(s.chipCol===undefined||!s.rows.length){catsEl.hidden=true;catsEl.innerHTML='';return}
  var st=tstate(s.name),id='c'+s.chipCol,cu=st.filt[id]||'';
  var allV=0;s.catStats.forEach(function(c){allV+=c.v});
  var h='<button type="button" class="cat" data-v="" aria-pressed="'+(cu===''?'true':'false')+'"><b>Semua</b><span>'+s.rows.length+' baris · '+money(allV)+'</span></button>';
  s.catStats.forEach(function(c){h+='<button type="button" class="cat" data-v="'+esc(c.k)+'" aria-pressed="'+(cu===c.k?'true':'false')+'"><b>'+esc(c.k)+'</b><span>'+c.n+' baris · '+money(c.v)+'</span></button>'});
  catsEl.innerHTML=h;catsEl.hidden=false;
}
catsEl.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button.cat');if(!b)return;
  var s=sheetByName(cur),st=tstate(cur),id='c'+s.chipCol,v=b.getAttribute('data-v');
  if(v)st.filt[id]=v;else delete st.filt[id];
  renderCats(s);render();
});
/* saran pencarian: hanya dari kolom No PKB/WO, Nama SA, No. Polisi, Kode Barang, Nama Barang, Nama Customer */
function fillSugg(s){setPlaceholder(s)}
var SHORT={'No PKB/WO':'WO','Nama SA':'SA','No. Polisi':'Polisi','Kode Barang':'Kode Barang','Nama Barang':'Nama Barang','Nama Customer':'Customer'};
function setPlaceholder(s){
  var names=searchCols(s).names;
  if(!names.length){qEl.placeholder='Pencarian';return}
  var narrow=window.matchMedia&&matchMedia('(max-width:700px)').matches;
  qEl.placeholder=narrow?('Cari '+names.map(function(n){return SHORT[n]||n}).join(', ')):('Pencarian '+names.join(', '));
}
window.addEventListener('resize',function(){if(model){var s=sheetByName(cur);if(s&&s.heads&&s.kind!=='cards')setPlaceholder(s)}});
function visibleIdx(s){
  var st=tstate(s.name),toks=st.q.trim().toLowerCase().split(/\s+/).filter(Boolean),defs=(s._defs||[]).slice(),out=[];
  if(s.chipCol!==undefined)defs.push({id:'c'+s.chipCol,col:s.chipCol});
  var active=defs.filter(function(d){return st.filt[d.id]});
  var scs=searchCols(s).cols;
  for(var i=0;i<s.rows.length;i++){
    var r=s.rows[i],ok=true;
    for(var a=0;a<active.length&&ok;a++){
      var d=active[a],v=r[d.col],f=st.filt[d.id];
      if(d.month)ok=monthKey(v)===f;
      else if(d.bucket)ok=bucketOf(v===''?null:+v)===+f;
      else ok=v===f;
    }
    if(ok&&toks.length){var hay='';for(var q=0;q<scs.length;q++)hay+=String(r[scs[q].ci])+'\u0001';hay=hay.toLowerCase();for(var t=0;t<toks.length&&ok;t++)ok=hay.indexOf(toks[t])>-1}
    if(ok)out.push(i);
  }
  if(st.sort>=0){
    var type=colType(s.heads[st.sort]),dir=st.dir;
    var keyed=out.map(function(i){return {i:i,k:sortKey(s.rows[i][st.sort],type)}});
    keyed.sort(function(a,b){
      if(a.k===null&&b.k===null)return a.i-b.i;if(a.k===null)return 1;if(b.k===null)return -1;
      var c=type==='text'?String(a.k).localeCompare(String(b.k),'id',{numeric:true}):(a.k-b.k);
      return c?c*dir:a.i-b.i;
    });
    out=keyed.map(function(x){return x.i});
  }
  return out;
}
function cellHTML(v,isNum,late,lng){var c=(v==='#N/A')?'err':'';if(isNum)c+=(c?' ':'')+'num';if(late)c+=(c?' ':'')+'late';if(lng)c+=(c?' ':'')+'long';return '<td'+(c?' class="'+c+'"':'')+'>'+esc(v)+'</td>'}
function render(){
  if(!model)return;
  var dv=D(),s=sheetByName(cur),st=tstate(s.name);
  summaryEl.hidden=(s.kind==='cards');
  if(s.kind==='cards'){
    toolsEl.hidden=true;catsEl.hidden=true;factsEl.innerHTML='';
    grid.className='grid cardsview';grid.innerHTML=cardsHTML();afterRender();return;
  }
  grid.className='grid';
  if(!dv.summary.rows&&s.name!=='PKB WIP'||!dv.summary.rows&&!s.rows.length){
    toolsEl.hidden=true;factsEl.innerHTML='';
    grid.innerHTML='<div class="empty"><b>Belum ada data untuk '+esc(dv.name)+'.</b><br>Kolom Devisi di Sheet1 belum memuat baris untuk divisi ini.</div>';
    afterRender();return;
  }
  if(!s.rows.length){
    toolsEl.hidden=true;factsEl.innerHTML='';
    grid.innerHTML='<div class="empty"><b>Belum ada baris.</b><br>'+esc(s.emptyMsg||('Tidak ada data di tab '+s.name+' untuk divisi '+dv.name+'.'))+'</div>';
    afterRender();return;
  }
  toolsEl.hidden=false;
  var idx=visibleIdx(s),h='',qty=0,val=0;
  var nfilt=Object.keys(st.filt).length,filtered=!!(st.q.trim()||nfilt);
  var noCol=(s.heads[0]==='No'),hc=s.heads.indexOf('Hari'),LONGC=s.heads.map(function(x){return x==='Alasan'||x==='Keterangan'||String(x).indexOf('Keterangan Team')===0});
  h='<table><thead><tr>'+s.heads.map(function(x,j){
    if(!x)return '<th></th>';
    if(x==='No')return '<th class="num" title="Nomor otomatis mulai dari 1 mengikuti baris yang tampil">No</th>';
    var sort=st.sort===j?(st.dir===1?'ascending':'descending'):'none';
    return '<th class="sortable'+(NUMH[x]?' num':'')+'" tabindex="0" aria-sort="'+sort+'" data-c="'+j+'" title="Klik untuk urut naik atau turun">'+esc(x)+'</th>';
  }).join('')+'</tr></thead><tbody>';
  var nn=0;
  idx.forEach(function(i){
    var r=s.rows[i];nn++;
    if(s.nums){qty+=s.nums[i][0];val+=s.nums[i][1]}
    h+='<tr'+(s.flags[i]?' class="flag"':'')+'>'+r.map(function(v,j){return cellHTML((noCol&&j===0)?String(nn):v,NUMH[s.heads[j]],j===hc&&v!==''&&+v>90,LONGC[j])}).join('')+'</tr>';
  });
  if(s.grand&&idx.length){
    h+='<tr class="total">'+s.heads.map(function(x,j){var v='';if(j===0)v=filtered?'Total tampil:':'Grand Total:';if(x==='Jlh')v=fint(filtered?qty:s.grand.qty);if(x==='Jumlah')v=fint(filtered?val:s.grand.val);return '<td'+(NUMH[x]?' class="num"':'')+'>'+v+'</td>'}).join('')+'</tr>';
  }
  h+='</tbody></table>';
  var f='<li><b>'+idx.length+'</b> dari '+s.rows.length+' baris</li>';
  if(s.grand)f+='<li>Qty <b>'+fint(filtered?qty:s.grand.qty)+'</b></li><li>Jumlah <b>Rp'+fint(filtered?val:s.grand.val)+'</b></li>';
  if(!filtered&&s.facts)f+=s.facts.join('');
  factsEl.innerHTML=f;
  grid.innerHTML=idx.length?h:'<div class="empty">Tidak ada baris yang cocok. Ubah kata cari atau klik Atur ulang.</div>';
  afterRender();
}
function afterRender(){buildFloat();syncX();updateJump()}
function hashSet(){
  try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  try{sessionStorage.setItem('mbf-pos',curDiv+'/'+cur)}catch(e){}
}
function selectTab(name,focus){
  cur=name;
  [].forEach.call(tabsEl.children,function(b){var on=b.getAttribute('data-n')===name;b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;if(on&&focus)b.focus()});
  hashSet();
  var ss=sheetByName(name);if(ss.kind!=='cards')setupControls(ss);
  render();
}
function buildTabs(){
  tabsEl.innerHTML='';
  D().sheets.forEach(function(s){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('data-n',s.name);
    b.innerHTML=esc(s.name)+'<small>'+s.rows.length+'</small>';
    b.addEventListener('click',function(){selectTab(s.name)});
    b.addEventListener('keydown',function(e){
      var names=D().sheets.map(function(x){return x.name}),k=names.indexOf(cur);
      if(e.key==='ArrowRight'){e.preventDefault();selectTab(names[(k+1)%names.length],true)}
      else if(e.key==='ArrowLeft'){e.preventDefault();selectTab(names[(k+names.length-1)%names.length],true)}
    });
    tabsEl.appendChild(b);
  });
}
function buildDivTabs(){
  divTabsEl.innerHTML='';
  model.divs.forEach(function(d){
    var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.setAttribute('data-d',d.name);
    b.innerHTML=esc(d.name)+'<small>'+d.summary.wo+' WO</small>';
    b.addEventListener('click',function(){selectDiv(d.name)});
    b.addEventListener('keydown',function(e){
      var names=model.divs.map(function(x){return x.name}),k=names.indexOf(curDiv);
      if(e.key==='ArrowRight'){e.preventDefault();selectDiv(names[(k+1)%names.length],null,true)}
      else if(e.key==='ArrowLeft'){e.preventDefault();selectDiv(names[(k+names.length-1)%names.length],null,true)}
    });
    divTabsEl.appendChild(b);
  });
}
function selectDiv(name,tabPref,focus){
  curDiv=name;
  [].forEach.call(divTabsEl.children,function(b){var on=b.getAttribute('data-d')===name;b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;if(on&&focus)b.focus()});
  buildTabs();renderSummary();
  var names=D().sheets.map(function(x){return x.name});
  var pick=(tabPref&&names.indexOf(tabPref)>-1)?tabPref:(names.indexOf(cur)>-1?cur:names[0]);
  selectTab(pick);
}
function partsOf(S){
  var pal=['var(--c1)','var(--c2)','var(--c3)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'],colors=[],pi=0,parts=S.divs||S.cats;
  if(S.divs){var dc={'GR Adam Malik':'var(--c5)','Body Repair':'var(--c2)','GR Flamboyan':'var(--c6)'};parts.forEach(function(c){colors.push(dc[c.k]||'var(--c4)')})}
  else S.cats.forEach(function(c){colors.push(c.k==='Non PKB'||c.k==='Tanpa Kategori'?'var(--c4)':pal[pi++%pal.length])});
  return {parts:parts,colors:colors};
}
function stackHTML(S){
  var p=partsOf(S),sum=S.total||1;
  return p.parts.map(function(c,i){return '<span style="width:'+(c.v/sum*100).toFixed(3)+'%;background:'+p.colors[i]+'" title="'+esc(c.k)+' '+money(c.v)+'"></span>'}).join('');
}
var TCOL={ok:'var(--ok)',amber:'var(--amber)',orange:'var(--orange)',red:'var(--red)'};

  el('herolab').textContent='Total material belum dibuka faktur — '+dv.name;

  }).join('');
}
/* tab Kartu Ringkasan: Semua Cabang = kartu 3 divisi; divisi = kartu per service kategori */

function catCardsHTML(dv,withDiv){

      +'<div class="dtot serif">Rp '+fint(c.v)+'</div>'

function cardsHTML(){
  var dv=D();

    return '<div class="dsecs">'+model.divs.filter(function(d){return d.name!==ALL}).map(function(d){

grid.addEventListener('click',function(e){

/* header tabel melayang + bilah geser samping (tabel tampil penuh, tanpa gulir di dalam tabel) */
var lockX=false,tick=false;
function syncX(){
  var sw=grid.scrollWidth,cw=grid.clientWidth;
  if(!grid.querySelector('table')||sw<=cw+2){xbar.style.display='none';return}
  xbar.style.display='block';xin.style.width=sw+'px';xbar.scrollLeft=grid.scrollLeft;
}
function buildFloat(){
  var th=grid.querySelector('thead');
  if(!th){fh.style.display='none';fh.innerHTML='';return}
  fh.innerHTML='<div class="fin"><table><thead>'+th.innerHTML+'</thead></table></div>';
  fh.firstChild.firstChild.setAttribute('data-w','');
  syncFloat();
}
function syncFloat(){
  var t=grid.querySelector('table'),thead=grid.querySelector('thead');
  if(!t||!thead||!fh.firstChild){fh.style.display='none';return}
  var gr=grid.getBoundingClientRect(),hr=thead.getBoundingClientRect();
  var top=(xbar.style.display==='block')?xbar.offsetHeight:0;
  if(!(hr.top<top&&gr.bottom>hr.height+top+10)){fh.style.display='none';return}
  fh.style.display='block';fh.style.top=top+'px';fh.style.left=(gr.left+1)+'px';fh.style.width=(gr.width-2)+'px';
  var fin=fh.firstChild,ft=fin.firstChild,key=t.offsetWidth+'|'+thead.querySelectorAll('th').length;
  if(ft.getAttribute('data-w')!==key){
    ft.style.width=t.offsetWidth+'px';
    var o=thead.querySelectorAll('th'),c=ft.querySelectorAll('th');
    for(var i=0;i<o.length&&i<c.length;i++){c[i].style.width=o[i].getBoundingClientRect().width+'px';c[i].removeAttribute('tabindex')}
    ft.setAttribute('data-w',key);
  }
  fin.style.transform='translateX('+(-grid.scrollLeft)+'px)';
}

function loadScript(urls){
  return new Promise(function(ok,no){
    var i=0;(function next(){
      if(i>=urls.length)return no({code:'lib',message:'Pustaka PDF tidak bisa dimuat. Periksa koneksi internet.'});
      var s=document.createElement('script');s.src=urls[i++];s.onload=function(){ok()};s.onerror=function(){s.remove();next()};document.head.appendChild(s);
    })();
  });
}
function ensurePdf(){
  var ready=function(){return window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API&&window.jspdf.jsPDF.API.autoTable};
  if(ready())return Promise.resolve();
  var p=(window.jspdf&&window.jspdf.jsPDF)?Promise.resolve():loadScript(LIBS.jspdf);
  return p.then(function(){return ready()?null:loadScript(LIBS.table)}).then(function(){if(!ready())throw {code:'lib',message:'Pustaka PDF tidak lengkap.'}});

function getDownloads(){

function saveBlob(filename,blob){

/* angka dan tanggal dari teks tampilan */
function parseNum(v){
  if(v===''||v==='#N/A'||v===null||v===undefined)return null;
  var n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));
  return isNaN(n)?null:n;
}
function parseDateSerial(v){
  var m=/^(\d\d)\/(\d\d)\/(\d{4})(?: (\d\d):(\d\d):(\d\d))?/.exec(v||'');
  if(!m)return null;
  var days=(Date.UTC(+m[3],+m[2]-1,+m[1])-Date.UTC(1899,11,30))/86400000;
  if(m[4])days+=(+m[4]*3600+ +m[5]*60+ +m[6])/86400;
  return days;
}
function describeFilter(s){
  if(s.kind==='cards')return '';
  var st=tstate(s.name),parts=[];
  if(st.q.trim())parts.push('Pencarian "'+st.q.trim()+'"');
  var defs=(s._defs||[]).slice();
  if(s.chipCol!==undefined)defs.push({id:'c'+s.chipCol,label:'Service Kategori',opts:null});
  defs.forEach(function(d){
    var f=st.filt[d.id];if(!f)return;
    var txt=f;
    if(d.opts){d.opts.forEach(function(o){if(o.v===f)txt=o.l})}
    parts.push(d.label+': '+txt);
  });
  return parts.length?('Filter: '+parts.join('; ')):'';
}
/* tabel yang akan diekspor */
function exportOf(s,filtered){
  if(s.kind==='cards')return cardsExport();
  var idx=filtered?visibleIdx(s):s.rows.map(function(_,i){return i});
  var noCol=s.heads[0]==='No',nn=0,disp=[],flags=[],qty=0,val=0;
  idx.forEach(function(i){
    var r=s.rows[i];nn++;
    disp.push(r.map(function(v,j){return (noCol&&j===0)?String(nn):v}));
    flags.push(!!s.flags[i]);
    if(s.nums){qty+=s.nums[i][0];val+=s.nums[i][1]}
  });
  var types=s.heads.map(function(h){return NUMH[h]?'num':(DATEH[h]?'date':'text')});
  var cells=disp.map(function(r){return r.map(function(v,j){
    if(types[j]==='num'){var n=parseNum(v);return n===null?'':n}
    if(types[j]==='date'){var d=parseDateSerial(v);return d===null?'':d}
    return v;
  })});
  return {name:s.name,heads:s.heads.slice(),disp:disp,cells:cells,types:types,flags:flags,grand:s.grand?{qty:qty,val:val}:null,count:disp.length,filter:filtered?describeFilter(s):''};
}
function cardsExport(){
  var dv=D(),buckets=['0-30 hari','31-60 hari','61-90 hari','> 90 hari'],isAllTab=(dv.name===ALL);
  var heads=(isAllTab?['Divisi']:[]).concat(['Service Kategori','Total (Rp)','% dari divisi','WO','Baris']);
  buckets.forEach(function(b){heads.push(b+' (Rp)');heads.push('WO '+b)});
  var off=isAllTab?1:0;
  var types=heads.map(function(h,j){return j<=off?'text':(j===off+2?'pct':'num')});
  var disp=[],cells=[],bold=[];
  function addDiv(d){
    var S=d.summary,sum=S.total||1;
    S.cats.forEach(function(c){
      var r=(isAllTab?[d.name]:[]).concat([c.k,c.v,c.v/sum,c.w,c.n]);c.bk.forEach(function(b){r.push(b.v);r.push(b.w)});
      cells.push(r);disp.push(r.map(function(v,j){return j<=off?v:(j===off+2?(v*100).toFixed(1).replace('.',',')+'%':fint(v))}));
    });
    var tr=(isAllTab?[d.name]:[]).concat([isAllTab?'Total divisi':(d.name+' (total)'),S.total,1,S.wo,S.rows]);S.bk.forEach(function(b){tr.push(b.v);tr.push(b.w)});
    cells.push(tr);bold.push(cells.length-1);disp.push(tr.map(function(v,j){return j<=off?v:(j===off+2?'100,0%':fint(v))}));
  }
  if(isAllTab){
    model.divs.filter(function(d){return d.name!==ALL}).forEach(addDiv);
    var S=dv.summary,gr=['Semua Cabang','Total semua cabang',S.total,1,S.wo,S.rows];S.bk.forEach(function(b){gr.push(b.v);gr.push(b.w)});
    cells.push(gr);bold.push(cells.length-1);disp.push(gr.map(function(v,j){return j<=off?v:(j===off+2?'100,0%':fint(v))}));
  }else addDiv(dv);
  return {name:CARDS,heads:heads,disp:disp,cells:cells,types:types,flags:disp.map(function(){return false}),grand:null,count:disp.length,filter:'',boldRows:bold};
}
/* ---- Excel ---- */
function excelSheet(exp,title){
  var aoa=[['PT Perintis Perkasa, Medan'],[title],[perText()+'   |   Diunduh: '+nowStr()]];
  if(exp.filter)aoa.push([exp.filter]);
  aoa.push([]);
  var hr=aoa.length;
  aoa.push(exp.heads.slice());
  exp.cells.forEach(function(r){aoa.push(r)});
  var firstData=hr+1,lastData=hr+exp.cells.length;
  var totalRow=null;
  if(exp.grand&&exp.cells.length){
    totalRow=aoa.length;
    var t=exp.heads.map(function(h,j){return j===0?'Total':''});
    aoa.push(t);
  }
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  var fmt={num:'#,##0',date:'dd/mm/yyyy',pct:'0.0%'};
  exp.heads.forEach(function(h,j){
    var z=exp.types[j]==='num'?(h==='Rate'?'#,##0.00':(h==='No'||h==='Hari'?'0':'#,##0')):fmt[exp.types[j]];
    if(!z)return;
    for(var r=firstData;r<=lastData;r++){var c=ws[XLSX.utils.encode_cell({r:r,c:j})];if(c&&c.t==='n')c.z=z}
  });
  if(totalRow!==null){
    exp.heads.forEach(function(h,j){
      if(h==='Jlh'||h==='Jumlah'){
        var col=XLSX.utils.encode_col(j),v=h==='Jlh'?exp.grand.qty:exp.grand.val;
        ws[XLSX.utils.encode_cell({r:totalRow,c:j})]={t:'n',v:v,f:'SUM('+col+(firstData+1)+':'+col+(lastData+1)+')',z:'#,##0'};
      }
    });
  }
  var endRow=totalRow!==null?totalRow:Math.max(lastData,hr);
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:endRow,c:Math.max(exp.heads.length-1,0)}});
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:hr,c:0},e:{r:Math.max(lastData,hr),c:exp.heads.length-1}})};
  ws['!cols']=exp.heads.map(function(h,j){
    var w=String(h).length;
    for(var i=0;i<exp.disp.length&&i<400;i++){var l=String(exp.disp[i][j]===undefined?'':exp.disp[i][j]).length;if(l>w)w=l}
    if(exp.types[j]==='date')w=Math.max(w,11);
    return {wch:Math.min(Math.max(w+2,6),44)};
  });
  return ws;
}
function sheetName(n,used){
  var s=String(n).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,31)||'Sheet';
  var b=s,k=2;while(used[s.toLowerCase()]){s=b.slice(0,28)+' '+k++}
  used[s.toLowerCase()]=1;return s;
}
function exportExcel(mode){
  var dv=D(),wb=XLSX.utils.book_new(),used={},list,fname,total=0,note='';
  if(mode==='all'){
    list=dv.sheets.filter(function(s){return s.kind==='cards'||s.rows.length>0}).map(function(s){return {s:s,filtered:false}});
    fname=fileBase('Semua-Tab');
  }else{
    var s0=sheetByName(cur);list=[{s:s0,filtered:true}];fname=fileBase(s0.name);
  }
  list.forEach(function(it){
    var exp=exportOf(it.s,it.filtered);
    if(!exp.count)return;
    total+=exp.count;
    var title='Laporan Material Belum Dibuka Faktur - '+dv.name+' - '+it.s.name;
    XLSX.utils.book_append_sheet(wb,excelSheet(exp,title),sheetName(it.s.name,used));
    if(exp.filter)note=' (sesuai filter)';
  });
  if(!wb.SheetNames.length)return Promise.reject({code:'kosong',message:'Tidak ada data untuk diekspor di tab ini.'});
  var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  var blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  return saveBlob(fname+'.xlsx',blob).then(function(){return {name:fname+'.xlsx',info:wb.SheetNames.length+' sheet, '+fint(total)+' baris'+note}});
}

function pdfText(v){return String(v===undefined||v===null?'':v).replace(/[\u2013\u2014]/g,'-').replace(/\u00b7/g,'|').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'')}
function exportPdf(){

    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(20,22,31);doc.text(pdfText('Laporan Material Belum Dibuka Faktur'),M,17);
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(60,64,80);
    doc.text(pdfText(dv.name+'  |  Tab: '+s.name+'  |  '+perText()),M,23);
    var y=28;
    var info=fint(exp.count)+' baris'+(exp.grand?('  |  Qty '+fint(exp.grand.qty)+'  |  Jumlah Rp '+fint(exp.grand.val)):'');
    doc.setFontSize(8.5);doc.setTextColor(106,111,128);doc.text(pdfText(info),M,y);y+=4.5;
    if(exp.filter){doc.text(pdfText(exp.filter),M,y);y+=4.5}
    var hariCol=exp.heads.indexOf('Hari'),body=exp.disp.map(function(r){return r.map(pdfText)}),foot;
    if(exp.grand){foot=[exp.heads.map(function(h,j){return j===0?'Total':(h==='Jlh'?fint(exp.grand.qty):(h==='Jumlah'?fint(exp.grand.val):''))})]}
    var colStyles={};
    exp.types.forEach(function(t,j){if(t==='num'||t==='pct')colStyles[j]={halign:'right'}});
    doc.autoTable({
      startY:y+1,head:[exp.heads.map(pdfText)],body:body,foot:foot,showFoot:'lastPage',showHead:'everyPage',theme:'grid',
      margin:{top:14,left:M,right:M,bottom:14},
      styles:{font:'helvetica',fontSize:fs,cellPadding:1.1,lineWidth:0.1,lineColor:[214,217,228],textColor:[20,22,31],overflow:'linebreak',valign:'middle'},
      headStyles:{fillColor:[236,232,255],textColor:[20,22,31],fontStyle:'bold',lineColor:[190,184,230]},
      footStyles:{fillColor:[246,220,120],textColor:[59,48,0],fontStyle:'bold'},
      alternateRowStyles:{fillColor:[248,248,252]},
      columnStyles:colStyles,

        if(h.section==='body'){
          if(exp.flags[h.row.index])h.cell.styles.fillColor=[255,241,220];
          if(j===hariCol&&+h.cell.raw>90){h.cell.styles.textColor=[217,45,32];h.cell.styles.fontStyle='bold'}
          if(exp.boldRows&&exp.boldRows.indexOf(h.row.index)>-1){h.cell.styles.fontStyle='bold';h.cell.styles.fillColor=[246,220,120];h.cell.styles.textColor=[59,48,0]}
        }
      }
    });
    var pages=doc.getNumberOfPages();
    for(var p=1;p<=pages;p++){
      doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(106,111,128);

    }
    var blob=doc.output('blob'),fname=fileBase(s.name)+'.pdf';
    return saveBlob(fname,blob).then(function(){return {name:fname,info:pages+' halaman, '+fint(exp.count)+' baris'+(exp.filter?' (sesuai filter)':'')}});
  });
}

  if(d>5||o===null||o===undefined)return null;
  if(typeof o==='string'){
    if(o.length>2000&&/^[A-Za-z0-9+\/=\s]+$/.test(o))return o;
    if(o.length>2000&&o.charAt(0)==='{'){try{return findB64(JSON.parse(o),d+1)}catch(e){}}
    return null;
  }
  if(Array.isArray(o)){for(var i=0;i<o.length;i++){var r=findB64(o[i],d+1);if(r)return r}return null}
  if(typeof o==='object'){
    var keys=['content','data','blob','base64Content'];
    for(var k=0;k<keys.length;k++){if(o[keys[k]]!==undefined){var r2=findB64(o[keys[k]],d+1);if(r2)return r2}}
    for(var key in o){if(keys.indexOf(key)<0){var r3=findB64(o[key],d+1);if(r3)return r3}}
  }
  return null;
}
function extractB64(res){
  if(!res)return null;
  return findB64(res.payload,0)||findB64(res.structuredContent,0)||findB64(res.content,0);
}
function whenXLSX(){return new Promise(function(ok,no){var n=0;(function chk(){if(window.XLSX)return ok();if(++n>100)return no({code:'lib',message:'Pustaka pembaca Excel tidak termuat.'});setTimeout(chk,100)})()})}
function handleWB(wb,ts){
  var raw=adapt(wb);liveOK=true;var prevMarker=model?model.marker:'';
  var changed=apply(raw,'live',ts);lastRead=Date.now();
  if(changed)toast(model.marker!==prevMarker?('Data berubah. Sekarang '+model.marker+'.'):'Isi data diperbarui.');
  else if(manual)toast('Sudah data terbaru. '+model.marker);
  manual=false;
}
function onFail(e){
  manual=false;
  if(e&&e.code==='struktur')setLive('bad','Struktur sheet berubah',e.message+' Data terakhir yang berhasil tetap ditampilkan.');
  else if(e&&e.code==='lib')setLive('off','Salinan tersimpan',e.message);
  else setLive('bad','Gagal membaca file','File dari Google tidak bisa dibaca sebagai Excel. Data terakhir yang berhasil tetap ditampilkan.');
}
function onResult(res){
  var b64=extractB64(res);
  if(!b64){setLive('bad','Isi file tidak terbaca','Google Drive membalas, tetapi isi file kosong atau bentuknya tidak dikenal. Data terakhir yang berhasil tetap ditampilkan.');return Promise.resolve()}
  return whenXLSX().then(function(){handleWB(XLSX.read(b64,{type:'base64'}),(res.cache&&res.cache.storedAt)||Date.now())}).catch(onFail);
}
/* jalur langsung: dipakai saat halaman dibuka sebagai file biasa / di situs sendiri (file Google Sheet harus "siapa saja yang memiliki link") */
/* jalur langsung: dipakai saat halaman dibuka sebagai file biasa atau di situs sendiri (mis. Vercel).
   Urutan: 1) /api/sheet (fungsi server di situs yang sama, tidak kena batasan CORS)  2) Google langsung (hanya jalan jika Google mengizinkan) */
var GOOGLE_URL='https://docs.google.com/spreadsheets/d/'+FILE_ID+'/export?format=xlsx';
var DIRECT_URLS=[];
if(/^https?:$/.test(location.protocol)&&location.hostname&&!/(^|\.)claude\.(ai|com)$/.test(location.hostname)&&!/claudeusercontent/.test(location.hostname))DIRECT_URLS.push('/api/sheet');
DIRECT_URLS.push(GOOGLE_URL);
var directOn=false,directTimer=null;
function fetchXlsx(i,errs){
  var u=DIRECT_URLS[i];
  var url=(u==='/api/sheet')?(u+'?t='+Date.now()):u;
  return fetch(url,{cache:'no-store'}).then(function(r){
    if(!r.ok){var er={code:'http',status:r.status,url:u};throw er}
    return r.arrayBuffer();
  }).catch(function(e){
    errs.push({url:u,e:e});
    if(i+1<DIRECT_URLS.length)return fetchXlsx(i+1,errs);
    throw {code:'all',errs:errs};
  });
}
function directOnce(){
  if(inFlight)return Promise.resolve();
  inFlight=true;refreshB.disabled=true;setLive('off busy','Membaca Google Sheet','');
  var keep=liveOK?' Data terakhir yang berhasil tetap ditampilkan.':' Menampilkan salinan tersimpan.';
  return fetchXlsx(0,[]).then(function(buf){
    return whenXLSX().then(function(){handleWB(XLSX.read(new Uint8Array(buf),{type:'array'}),Date.now())});
  }).catch(function(e){
    if(e&&(e.code==='struktur'||e.code==='lib')){onFail(e);return}
    if(e&&e.name==='SyntaxError'){onFail(e);return}
    var errs=(e&&e.code==='all')?e.errs:[],hasProxy=DIRECT_URLS[0]==='/api/sheet',px=errs[0],gg=errs[errs.length-1];
    var msg,cls='off',title='Salinan tersimpan · belum tersambung ke Google Sheet';
    if(hasProxy&&px&&px.e&&px.e.code==='http'&&px.e.status===404){
      msg='Fungsi /api/sheet belum terpasang di situs ini, dan browser tidak diizinkan Google membaca file secara langsung. Tambahkan folder api/sheet.js ke proyek Vercel (lihat panduan), lalu deploy ulang.';
    }else if(hasProxy&&px&&px.e&&px.e.code==='http'){
      msg='Fungsi /api/sheet membalas kode '+px.e.status+'. Cek log fungsi di Vercel dan pastikan berbagi file Google Sheet diatur "Siapa saja yang memiliki link bisa melihat".';
      cls='warn';title='Google Sheet belum bisa dibaca';
    }else if(gg&&gg.e&&gg.e.code==='http'){
      msg='Google menolak akses (kode '+gg.e.status+'). Pastikan berbagi file diatur "Siapa saja yang memiliki link bisa melihat".';cls='bad';title='Google Sheet tidak bisa dibuka';
    }else{
      msg='Browser tidak bisa mengambil Google Sheet langsung (jaringan terputus, atau Google tidak mengizinkan pembacaan dari halaman ini). Di situs sendiri, pasang fungsi /api/sheet.';
    }
    if(liveOK){cls='warn';title='Gagal memperbarui'}
    setLive(cls,title,msg+keep);
  }).then(function(){inFlight=false;refreshB.disabled=false});
}
function startDirect(){
  if(directOn)return;
  directOn=true;directOnce();
  directTimer=setInterval(function(){if(!document.hidden)directOnce()},REFRESH_MS);
}
function onError(er){
  manual=false;
  var c=er&&er.code,keep=liveOK?' Data terakhir yang berhasil tetap ditampilkan.':' Menampilkan salinan tersimpan.';
  if(c==='server_not_connected')setLive('bad','Google Drive belum tersambung','Tambahkan konektor Google Drive di Pengaturan, Konektor, claude.ai.'+keep);
  else if(c==='needs_reauth')setLive('bad','Perlu masuk ulang ke Google Drive','Sambungkan ulang Google Drive di Pengaturan, Konektor, claude.ai.'+keep);
  else if(c==='not_in_manifest'||c==='consent_required')setLive('warn','Akses belum diizinkan','Halaman ini belum diberi izin membaca Google Drive. Muat ulang halaman dan pilih Izinkan.'+keep);
  else if(c==='selection_required')setLive('warn','Pilih akun Google Drive','Ada lebih dari satu konektor Google Drive. Pilih salah satu saat diminta.'+keep);
  else if(c==='blocked_by_policy'||c==='approval_required')setLive('bad','Diblokir kebijakan organisasi','Kebijakan organisasi tidak mengizinkan halaman ini membaca Google Drive.'+keep);
  else if(c==='tool_error')setLive('bad','Google Drive menolak','Google Drive melaporkan: '+(er.message||'gagal membaca file')+'. Pastikan akun Anda punya akses ke file ini.'+keep);
  else if(c==='server_unavailable'||c==='upstream_error'||c==='rate_limited')setLive('warn','Google Drive belum merespons','Akan dicoba lagi otomatis. Tekan Refresh untuk mencoba segera.'+keep);
  else if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')setLive('off','Salinan tersimpan · tidak tersambung','Tampilan ini tidak bisa terhubung ke Google Drive (misalnya dibuka lewat tautan publik atau di luar claude.ai).');
  else setLive('warn','Belum bisa membaca','Terjadi kendala saat membaca Google Sheet ('+(c||'tidak dikenal')+').'+keep);
}
function startLive(){
  if(starting)return;starting=true;
  if(!window.claude||typeof claude.use!=='function'){starting=false;startDirect();return}
  setLive('off busy','Menghubungkan ke Google Sheet','');
  claude.use('mcp').then(function(m){
    starting=false;
    if(!m){startDirect();return}
    mcp=m;
    if(watching)return;
    watching=true;
    try{
      mcp.watchTool(SERVER,TOOL,{fileId:FILE_ID,exportMimeType:XLSX_MIME},function(ev){if(ev.type==='data')onResult(ev.result);else onError(ev.error)},{refetchInterval:REFRESH_MS});
    }catch(e){watching=false;onError({code:'bad_request',message:String(e)})}
  },function(){starting=false;startDirect()});
}
function refreshNow(){
  if(inFlight)return;
  manual=true;
  if(directOn){directOnce();return}
  if(mcp){
    inFlight=true;refreshB.disabled=true;setLive('off busy','Membaca Google Sheet','');
    mcp.callTool(SERVER,TOOL,{fileId:FILE_ID,exportMimeType:XLSX_MIME},{cache:{refresh:true}}).then(function(res){return onResult(res)},onError).then(function(){inFlight=false;refreshB.disabled=false});
    return;
  }
  /* belum tersambung: coba hubungkan lagi */
  if(!starting)startLive();
}
refreshB.addEventListener('click',refreshNow);
document.addEventListener('visibilitychange',function(){
  if(document.hidden||!directOn)return;
  if(Date.now()-lastRead>REFRESH_MS)directOnce();
});

var SNAP=JSON.parse(el('snap').textContent);

apply(SNAP,'snap',Date.now());
startLive();
})();
</script>
